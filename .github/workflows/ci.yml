name: CI

# Safe for public PRs: "pull_request" (not pull_request_target), read-only token, no repository
# secrets used anywhere. All credentials are the fake local values from .env.example.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --no-banner --exit-code 1

  backend:
    name: Backend (lint, tests, licences)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt ruff pip-licenses
      - name: Lint
        run: ruff check --select E,F,W --ignore E501 app tests ../scripts/demo
      - name: Tests
        run: python -m pytest -q
      - name: Licence check (no GPL/AGPL in the dependency tree)
        run: |
          pip-licenses --from=mixed --format=markdown
          pip-licenses --from=mixed --fail-on="GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;GNU General Public License v2 (GPLv2);GNU General Public License v3 (GPLv3);GNU Affero General Public License v3"

  cli:
    name: CLI (syntax + diff round trip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r cli/requirements.txt
      - run: python -m py_compile cli/*.py scripts/*.py scripts/demo/*.py
      - name: OTADIF01 round trip (newest and oldest supported bsdiff4)
        working-directory: cli
        run: |
          for v in "" "==1.2.6"; do
            [ -n "$v" ] && pip install -q "bsdiff4$v"
            python - <<'EOF'
          import os, bsdiff4, importlib.metadata as m, otadiff
          old = os.urandom(50000); new = old[:20000] + os.urandom(500) + old[20000:]
          assert otadiff.patch(old, otadiff.diff(old, new)) == new
          print("otadiff round trip ok with bsdiff4", m.version("bsdiff4"))
          EOF
          done

  flutter:
    name: Flutter (ota_client + example_app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: ota_client analyze + test
        working-directory: packages/ota_client
        run: flutter pub get && flutter analyze && flutter test
      - name: example_app analyze
        working-directory: example_app
        run: flutter pub get && flutter analyze

  e2e:
    name: Docker build + local end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: ./scripts/setup_local.sh
      - run: ./scripts/seed_demo.sh
      - run: ./scripts/publish_test_patch.sh
      - run: ./scripts/verify_demo.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Clean up
        if: always()
        run: ./scripts/cleanup_local.sh --yes

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x flutter-ota-system.sh scripts/*.sh deploy/*.sh

name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: "What are you trying to do, and what stops you?" }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
  - type: textarea
    id: security
    attributes:
      label: Security / compatibility impact
      description: Does this touch signing, verification, rollout, device auth, the patch format or store policy?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.

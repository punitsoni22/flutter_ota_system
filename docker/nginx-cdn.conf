# Serves the immutable, content-addressed patch files. Only patches/: releases/ holds whole store
# builds (the app's compiled code), which the admin API hands out to the CLI only.
server {
    listen 80;
    location /cdn/patches/ {
        alias /data/artifacts/patches/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        types { } default_type application/octet-stream;
        autoindex off;
    }
    location /cdn/ { return 404; }
    location = /health { return 200 "ok\n"; }
}

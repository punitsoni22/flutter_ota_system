# Minimal host pubspec.lock (only the package names are read by patch_guard).
packages:
  meta:
    dependency: transitive
    description:
      name: meta
      url: "https://pub.dev"
    source: hosted
    version: "1.17.0"
  native_crypto:
    dependency: "direct main"
    description:
      path: "../packages/native_crypto"
      relative: true
    source: path
    version: "0.0.0"
sdks:
  dart: ">=3.13.0 <4.0.0"

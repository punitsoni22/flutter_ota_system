// Android side of flutter_ota_system: picks the patched libapp.so before the Flutter engine starts.
// Plain Java, so it builds with the host app's Android Gradle Plugin (8.x or 9.x) and no Kotlin setup.
group = "io.github.punitsoni22.flutter_ota_system"
version = "1.0"

apply plugin: "com.android.library"

android {
    namespace = "io.github.punitsoni22.flutter_ota_system"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    // JVM unit tests only (src/test); nothing is added to the app.
    testImplementation "junit:junit:4.13.2"
}

name: flutter_ota_system
description: >-
  Experimental Flutter client for Flutter OTA System, a self-hosted OTA patch platform:
  signed patches, staged updates and automatic fallback. Android only.
version: 0.1.0-alpha.1
homepage: https://github.com/punitsoni22/flutter_ota_system
repository: https://github.com/punitsoni22/flutter_ota_system/tree/main/packages/ota_client
issue_tracker: https://github.com/punitsoni22/flutter_ota_system/issues
documentation: https://github.com/punitsoni22/flutter_ota_system/blob/main/docs/flutter-integration.md
topics:
  - ota
  - code-push
  - over-the-air
  - self-hosted
  - patching

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.2.2
  path_provider: ^2.1.5
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Not used by the code and not shipped to apps. Every path_provider version allows
  # platform 3.0.0 (via path_provider_platform_interface), which no longer compiles with
  # Dart 3.12; this keeps `pub downgrade` testing of our own lower bounds meaningful.
  platform: ^3.1.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.punitsoni22.flutter_ota_system
        pluginClass: OtaClientPlugin

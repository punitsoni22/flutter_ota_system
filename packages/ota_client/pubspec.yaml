name: ota_client
description: "Over-the-air patch client for Flutter: check, download, verify (SHA-256 + ES256), stage, boot protection."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  http: ^1.2.2
  path_provider: ^2.1.5
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.flutterota.ota_client
        pluginClass: OtaClientPlugin

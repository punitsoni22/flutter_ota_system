name: flutter_ota_system_example
description: The official demo app of the flutter_ota_system package (Flutter OTA System client).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_ota_system:
    path: ../
  # Reads this build's version and build number, which must match the registered release.
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

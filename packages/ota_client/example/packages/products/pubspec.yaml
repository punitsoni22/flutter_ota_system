#
# Feature package of the demo app. `flutter_ota patch android` can replace this package's code
# on the phone. The app reaches it only through ProductsFeature (lib/products.dart).
name: products
description: Products feature of the Flutter OTA System demo app.
publish_to: none
version: 1.0.0

environment:
  # freezed 4 needs Dart 3.13 (the pinned OTA toolchain, Flutter 3.47.9).
  sdk: ^3.13.0
  flutter: ">=3.47.9"

dependencies:
  flutter:
    sdk: flutter
  flutter_ota_system:
    path: ../../../
  core:
    path: ../core
  http: ^1.2.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.16.2
  # freezed 4.0.3 or newer: freezed 3.x writes code that Dart 3.13 rejects.
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  flutter_lints: ^6.0.0

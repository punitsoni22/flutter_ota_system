name: flutter_ota_cli
description: >-
  Experimental developer CLI (command `flutter_ota`) for Flutter OTA System: project setup,
  configuration and the pinned OTA toolchain. Linux x64 hosts only.
version: 0.1.0-alpha.1
publish_to: none
repository: https://github.com/punitsoni22/flutter_ota_system/tree/main/packages/flutter_ota_cli

environment:
  sdk: ">=3.8.0 <4.0.0"

executables:
  flutter_ota: flutter_ota

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  http: ^1.2.2
  path: ^1.9.0
  pointycastle: ^4.0.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
